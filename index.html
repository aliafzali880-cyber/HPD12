<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 تولدت مبارک</title>

  <!-- فونت فارسی وزیرمتن از Google Fonts (بدون اینترنت از فونت سیستم استفاده می‌شود) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- لایه‌های پس‌زمینه و افکت‌ها -->
  <canvas id="sparkle-canvas" aria-hidden="true"></canvas>
  <div id="balloons" class="balloons" aria-hidden="true"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="page">

    <!-- ========== باکس متن ========== -->
    <section class="glass-card text-card">
      <h1 class="birthday-title">🎂 تولدت مبارک 🎂</h1>

      <!-- متن رو اینجا بنویس -->
      <textarea class="text-card__input" id="birthday-text" rows="7"
        placeholder="متن تبریک خودت رو اینجا بنویس...">امروز روز توئه! ✨
آرزو می‌کنم سالی پر از شادی، سلامتی و موفقیت داشته باشی.
ممنون که هستی و دنیای ما رو قشنگ‌تر می‌کنی. 💙</textarea>
    </section>

    <!-- ========== باکس ویدئو ========== -->
    <section class="glass-card video-card">
      <!-- مسیر فایل ویدئو رو اینجا بذار (مثلاً: videos/birthday.mp4) -->
      <video class="video-card__player" controls playsinline preload="metadata">
        <source src="videos/birthday.mp4" type="video/mp4">
        مرورگر شما از پخش ویدئو پشتیبانی نمی‌کند.
      </video>
    </section>

    <!-- ========== دکمه‌ها ========== -->
    <section class="actions">
      <button class="btn" id="confetti-btn" type="button">🎉 کانفتی</button>
      <button class="btn btn--accent" id="surprise-btn" type="button">🎁 یه سورپرایز</button>
      <button class="btn" id="music-btn" type="button" aria-pressed="false">🎵 پخش موسیقی</button>
    </section>

  </main>

  <!-- ========== پیام سورپرایز ========== -->
  <div class="surprise" id="surprise" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="surprise__box">
      <div class="surprise__emoji">🎈🎂🎈</div>
      <h2 class="surprise__title">تولدت مبارک عزیزم!</h2>
      <p class="surprise__text">
        <!-- پیام سورپرایز رو اینجا بنویس -->
        امیدوارم تمام آرزوهات امسال به حقیقت بپیونده. تو بهترینی! 💙
      </p>
      <button class="btn" id="surprise-close" type="button">ممنون 💖</button>
    </div>
  </div>

  <!-- مسیر فایل موسیقی رو اینجا بذار (مثلاً: music/birthday.mp3) -->
  <audio id="bg-music" loop preload="none">
    <source src="music/birthday.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
